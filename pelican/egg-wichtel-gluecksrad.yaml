_comment: "Wichtel-Glücksrad – erzeugt mit npm run egg"
meta:
  version: PLCN_v3
  update_url: null
exported_at: "2026-11-25T19:37:57.148Z"
name: "Wichtel-Glücksrad"
author: "14853454+laserm4rc@users.noreply.github.com"
uuid: 44b56edb-47ab-4617-a9c1-df90c82b32cf
description: "Wichtel-Glücksrad als Pelican-Egg. Teilnehmer melden sich mit eigenem Passwort an und drehen am Rad, die Zuteilung steht vorher fest. Admin unter /admin, Befehle in der Konsole (help). Version 0.1.0."
tags:
  - nodejs
  - web
features: []
docker_images:
  "Node.js 22": ghcr.io/pelican-eggs/yolks:nodejs_22
  "Node.js 24": ghcr.io/pelican-eggs/yolks:nodejs_24
file_denylist: []
startup_commands:
  Default: "node server/index.js"
config:
  files: {}
  startup:
    done:
      - "Konsole bereit"
  logs: {}
  stop: stop
scripts:
  installation:
    script: |
      #!/bin/bash
      # Wichtel-Glücksrad – Installationsskript für Pelican.
      # Läuft im Installations-Container (node:22-bookworm-slim), das Server-Verzeichnis ist /mnt/server.
      # Lädt den Code von GitHub, installiert die Abhängigkeiten und baut die Oberfläche.
      # Bei einer Neuinstallation bleiben data/ (Datenbank) und .env erhalten.
      set -euo pipefail

      echo "== Pakete installieren"
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null

      echo "== Code laden"
      REPO="${GIT_ADDRESS:-}"
      if [ -z "$REPO" ]; then
        echo "Fehler: GIT_ADDRESS ist leer. Bitte die Repo-Adresse in den Server-Variablen eintragen." >&2
        exit 1
      fi
      [[ "$REPO" != *.git ]] && REPO="${REPO}.git"
      if [ -n "${USERNAME:-}" ] && [ -n "${ACCESS_TOKEN:-}" ]; then
        # Privates Repo: Zugangsdaten in die Adresse einsetzen (nur für diesen Klon)
        REPO="https://${USERNAME}:${ACCESS_TOKEN}@${REPO#https://}"
      fi
      BRANCH="${BRANCH:-main}"

      rm -rf /tmp/app
      git clone --quiet --depth 1 --branch "$BRANCH" "$REPO" /tmp/app
      rm -rf /tmp/app/.git

      mkdir -p /mnt/server
      cd /mnt/server
      # Alten Code entfernen, Datenbank und .env behalten
      find /mnt/server -mindepth 1 -maxdepth 1 ! -name data ! -name .env -exec rm -rf {} +
      cp -a /tmp/app/. /mnt/server/
      rm -rf /tmp/app

      echo "== Abhängigkeiten installieren"
      # --ignore-scripts: better-sqlite3 bringt fertige Linux-Binärdateien mit, ein Compiler ist nicht nötig
      npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      echo "== Oberfläche bauen"
      npm run build --silent

      echo "== Entwicklungs-Pakete entfernen"
      npm prune --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error

      mkdir -p /mnt/server/data
      echo "== Installation fertig"
    container: "node:22-bookworm-slim"
    entrypoint: bash
variables:
  - sort: 1
    name: "Admin-Passwort"
    description: "Passwort für den Admin-Bereich unter /admin. Ohne Passwort ist der Web-Admin gesperrt (die Konsole funktioniert trotzdem)."
    env_variable: ADMIN_PASSWORD
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - "required"
      - "string"
      - "min:8"
      - "max:128"
  - sort: 2
    name: "Event-Titel"
    description: "Startwert für den Titel. Lässt sich danach im Admin unter „Event“ ändern, dann gilt der Wert aus dem Admin."
    env_variable: EVENT_TITLE
    default_value: "Wichteln"
    user_viewable: true
    user_editable: true
    rules:
      - "required"
      - "string"
      - "max:100"
  - sort: 3
    name: "Budget"
    description: "Optional, z. B. „25 €“. Startwert, im Admin änderbar."
    env_variable: BUDGET
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - "nullable"
      - "string"
      - "max:50"
  - sort: 4
    name: "Datum"
    description: "Optional, z. B. „Fr, 19.12., 18 Uhr“. Startwert, im Admin änderbar."
    env_variable: EVENT_DATE
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - "nullable"
      - "string"
      - "max:100"
  - sort: 5
    name: "Ort"
    description: "Optional, z. B. „bei Anna“. Startwert, im Admin änderbar."
    env_variable: EVENT_LOCATION
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - "nullable"
      - "string"
      - "max:100"
  - sort: 6
    name: "Öffentliche Adresse"
    description: "Adresse, unter der die Seite erreichbar ist, z. B. https://wichteln.example.de. Wird in Einladungen verwendet. Leer = Adresse aus dem Browser."
    env_variable: BASE_URL
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - "nullable"
      - "string"
      - "max:200"
  - sort: 7
    name: "Git-Repo"
    description: "Woher der Code geladen wird."
    env_variable: GIT_ADDRESS
    default_value: "https://github.com/laserm4rc/wichtel-gluecksrad"
    user_viewable: true
    user_editable: true
    rules:
      - "required"
      - "string"
      - "max:300"
  - sort: 8
    name: "Branch"
    description: "Welcher Branch installiert wird."
    env_variable: BRANCH
    default_value: "main"
    user_viewable: true
    user_editable: true
    rules:
      - "required"
      - "string"
      - "max:100"
  - sort: 9
    name: "Git-Benutzername"
    description: "Nur für ein privates Repo nötig."
    env_variable: USERNAME
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - "nullable"
      - "string"
      - "max:100"
  - sort: 10
    name: "Git-Access-Token"
    description: "Nur für ein privates Repo nötig (GitHub: Fine-grained Token mit Lesezugriff auf den Code)."
    env_variable: ACCESS_TOKEN
    default_value: ""
    user_viewable: true
    user_editable: true
    rules:
      - "nullable"
      - "string"
      - "max:300"
